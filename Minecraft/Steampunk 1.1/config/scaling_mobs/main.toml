
[Misc]
	#The amount by which mobs scale, per Minecraft day
	#Range: 0.0 ~ Infinity
	"Scaling Speed" = 1.0
	#Players with lower scale will receive a higher boost to their stats
	#Range: 0.0 ~ Infinity
	"Player Scale Favor" = 10.0
	#If true, mob stats will increase exponentially
	"Use Exponential Scaling" = false
	#If true, mob scaling speed will increase with more players in the world, up to 2x with 5 players
	#Scaling will also cease if no players are on the server
	"Scale with Player Count" = true
	#After this day in the Minecraft world, all hostile mobs will be immune to burning in daylight
	#Range: > 0
	"Mobs Stop Burning on Day" = 30
	#A list of mobs that will scale, even if they're not monsters
	"Mob Whitelist" = ["guardvillagers:guard", "minecraft:iron_golem", "takesapillage:clay_golem", "minecraft:snow_golem", "minecraft:wolf"]
	#A list of mobs that will not scale, even if they're monsters
	"Mob Blacklist" = []

[Health]
	#The decimal amount that hostile mobs' health increase per day
	#Range: 0.0 ~ Infinity
	"Health Scale Rate" = 0.01
	#The decimal amount of the mobs' base health in the beginning
	#Range: 0.0 ~ Infinity
	"Mob Health Base" = 0.0
	#The maximum amount that hostile mobs' damage can scale to
	#Range: 0.0 ~ Infinity
	"Max Scaled Health" = 3.0

[Damage]
	#The decimal amount that hostile mobs' damage increase per day
	#Range: 0.0 ~ Infinity
	"Damage Scale Rate" = 0.00617284
	#The decimal amount of the mobs' base damage in the beginning
	#Range: 0.0 ~ Infinity
	"Mob Damage Base" = 0.0
	#The maximum amount that hostile mobs' damage can scale to
	#Range: 0.0 ~ Infinity
	"Max Scaled Damage" = 2.0

[Speed]
	#The decimal amount that hostile mobs' speed increase per day
