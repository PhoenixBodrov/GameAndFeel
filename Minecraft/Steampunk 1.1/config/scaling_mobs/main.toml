	#Range: 0.0 ~ Infinity
	"Armor Piercing Base" = 0.0
	#The maximum amount of increase to mobs' damage that ignores armor
	#Range: 0.0 ~ Infinity
	"Max Scaled Armor Piercing" = 0.3

