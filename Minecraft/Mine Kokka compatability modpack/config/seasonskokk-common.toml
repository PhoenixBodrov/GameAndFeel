#Качество физической симуляции мира. Цвета сезонов, плавные переходы и сам снегопад остаются красивыми на любом уровне; меняется в основном частота тяжёлых изменений блоков: накопление снега, лёд, посевы, грядки, листва и растения. Все режимы используют ограничение времени на серверном тике.
[simulation]
	#Главный профиль нагрузки и детализации физического мира.
	#VERY_LOW — Очень низкая: максимум визуала, минимум изменений блоков; бюджет около 0.25 мс/тик.
	#LOW — Низкая: лёгкая глобальная симуляция; около 0.5 мс/тик.
	#MEDIUM — Средняя: баланс для больших сборок; около 0.9 мс/тик.
	#HIGH — Высокая: быстрее снег/лёд/растительность; около 1.5 мс/тик.
	#VERY_HIGH — Очень высокая: плотная физическая симуляция; около 2.5 мс/тик.
	#SEASONS_KOKK — максимум: самые глубокие сугробы и быстрый догон мира; до 5 мс/тик, но с защитой от спайков.
	#Allowed Values: VERY_LOW, LOW, MEDIUM, HIGH, VERY_HIGH, SEASONS_KOKK
	quality = "MEDIUM"
	#Защита от лагов: прекращать тяжёлую сезонную работу до следующего тика, когда выбранный профиль уже израсходовал свой бюджет времени. Рекомендуется всегда держать включённой, в том числе на Seasons,Kokk.
	adaptiveBudget = true

#Календарь сезонов. Скорость берётся напрямую из NightNight: изменение длины дня/ночи и ускорение сна ускоряют или замедляют сезоны так же. Seasons,Kokk сам dayTime не меняет.
[calendar]
	#Главный переключатель сезонной системы.
	enabled = true
	#Сезон нового мира при первом создании данных Seasons,Kokk.
	#Allowed Values: SPRING, SUMMER, AUTUMN, WINTER
	startSeason = "SPRING"
	#Включено: сезоны сменяют друг друга. Выключено: выбранный ниже сезон фиксируется навсегда, пока настройку не поменять.
	automaticSeasonChange = false
	#Какой сезон держать постоянно, когда автоматическая смена отключена.
	#Allowed Values: SPRING, SUMMER, AUTUMN, WINTER
	fixedSeason = "SPRING"
	#Если включено, календарь сезонов не идёт, когда на сервере нет игроков.
	pauseWithoutPlayers = true
	#Базовая длина одного сезонного дня при скорости NightNight x1. 20 минут = 24000 тиков NightNight, то есть одни обычные Minecraft-сутки. При сне NightNight ускоряет этот календарь автоматически.
	# Default: 20
	# Range: 1 ~ 1440
	seasonDayMinutes = 20
	#Насколько растянуть плавный переход вокруг границы сезонов. 0% = резкая смена, 50% = очень плавная. Влияет на цвета, густоту листвы/травы и температуру.
	# Default: 50
	# Range: 0 ~ 100
	transitionPercent = 50
	#Разбивает фронт смены сезона на естественные пятна вместо ровных квадратов/колонок. Используется для цветов, листвы и наземной травы.
	transitionNoiseEnabled = true
	#Средний размер пятен сезонного шума, в блоках. Меньше = более мелкая рябь, больше = крупные естественные области.
	# Default: 24
	# Range: 4 ~ 128
	transitionNoiseScaleBlocks = 24
	#Насколько сильно соседние участки мира могут опережать или отставать по плавному переходу сезона, %. 0 = ровный фронт, 100 = максимально выраженные пятна.
	# Default: 70
	# Range: 0 ~ 100
	transitionNoiseStrengthPercent = 70
	#Сколько сезонных дней длится весна. 0 = бесконечная весна.
	# Default: 12
	# Range: 0 ~ 3650
	springDays = 12
	#Сколько сезонных дней длится лето. 0 = бесконечное лето.
	# Default: 12
	# Range: 0 ~ 3650
	summerDays = 12
	#Сколько сезонных дней длится осень. 0 = бесконечная осень.
	# Default: 12
	# Range: 0 ~ 3650
	autumnDays = 12
	#Сколько сезонных дней длится зима. 0 = бесконечная зима.
	# Default: 12
	# Range: 0 ~ 3650
	winterDays = 12

#Густота листвы и наземной травы. Значения между сезонами меняются постепенно.
[vegetation]
	#Включает сезонное скрытие и восстановление естественной листвы. Скрытая листва остаётся LeavesBlock для TreeChop.
	foliageEnabled = true
	#Видимая листва весной, %.
	# Default: 100
	# Range: 0 ~ 100
	springLeavesPercent = 100
	#Видимая листва летом, %.
	# Default: 100
	# Range: 0 ~ 100
	summerLeavesPercent = 100
	#Видимая листва осенью, %. К концу перехода листва постепенно редеет.
	# Default: 55
	# Range: 0 ~ 100
	autumnLeavesPercent = 55
	#Видимая листва зимой, %. 0 = полностью голые естественные деревья.
	# Default: 0
	# Range: 0 ~ 100
	winterLeavesPercent = 0
	#Включает сезонное прореживание короткой/высокой травы и папоротников. Блок травы не исчезает — меняется только его цвет.
	groundVegetationEnabled = true
	#Сколько наземной травы и папоротников оставлять весной, %.
	# Default: 100
	# Range: 0 ~ 100
	springGrassPercent = 100
	#Сколько наземной травы и папоротников оставлять летом, %.
	# Default: 90
	# Range: 0 ~ 100
	summerGrassPercent = 90
	#Сколько наземной травы и папоротников оставлять осенью, %.
	# Default: 45
	# Range: 0 ~ 100
	autumnGrassPercent = 45
	#Сколько наземной травы и папоротников оставлять зимой, %. 0 = травы нет.
	# Default: 0
	# Range: 0 ~ 100
	winterGrassPercent = 0
	#Включает сезонное исчезновение и возвращение обычных цветов.
	flowersEnabled = true
	#Сколько цветов оставлять весной, %.
	# Default: 100
	# Range: 0 ~ 100
	springFlowersPercent = 100
	#Сколько цветов оставлять летом, %.
	# Default: 85
	# Range: 0 ~ 100
	summerFlowersPercent = 85
	#Сколько цветов оставлять осенью, %. Они постепенно редеют вместе с сезоном.
	# Default: 25
	# Range: 0 ~ 100
	autumnFlowersPercent = 25
	#Сколько цветов оставлять зимой, %. 0 = цветы полностью исчезают до весны.
	# Default: 0
	# Range: 0 ~ 100
	winterFlowersPercent = 0
	#Если выключено, листва, поставленная игроком или отмеченная persistent, не скрывается.
	affectPersistentLeaves = false
	#Радиус обработки растительности вокруг игрока, в блоках.
	# Default: 72
	# Range: 8 ~ 256
	radiusBlocks = 72
	#Высота обработки вверх и вниз от игрока, в блоках.
	# Default: 48
	# Range: 8 ~ 192
	verticalRangeBlocks = 48
	#За сколько секунд в среднем мод проверяет всю область растительности вокруг игрока. Меньше = листья и трава быстрее догоняют текущий сезон; больше = ниже нагрузка.
	# Default: 30
	# Range: 5 ~ 300
	fullScanSeconds = 30

#Сезонная окраска травы, блока травы и листвы. Переходы плавные, без смены цвета одним кадром.
[colors]
	#Включить сезонные цвета растительности.
	enabled = true
	#Окрашивать листву деревьев.
	leaves = true
	#Окрашивать блок травы, короткую/высокую траву и папоротники.
	grass = true
	#Сила весенней окраски, %. Весна сделана яркой и насыщенно-зелёной.
	# Default: 62
	# Range: 0 ~ 100
	springStrengthPercent = 62
	#Сила летней окраски, %. Лето темнее и спокойнее весны.
	# Default: 45
	# Range: 0 ~ 100
	summerStrengthPercent = 100
	#Сила осенней окраски, %. Осень уходит в золотисто-коричневые оттенки.
	# Default: 82
	# Range: 0 ~ 100
	autumnStrengthPercent = 90
	#Сила зимней окраски, %. Оставшаяся растительность становится холодной и выцветшей.
	# Default: 68
	# Range: 0 ~ 100
	winterStrengthPercent = 80
	#Как часто перерисовывать уже загруженные чанки для плавного изменения цвета, в секундах. Меньше = плавнее, но тяжелее для FPS.
	# Default: 15
	# Range: 2 ~ 120
	refreshSeconds = 15

#Сезонная частота дождя и гроз.
[weather]
	#Разрешает Seasons,Kokk запускать сезонные дожди и грозы.
	enabled = true
	#Как часто при ясной погоде проверять начало осадков, в минутах.
	# Default: 5
	# Range: 1 ~ 120
	checkIntervalMinutes = 5
	#Если включено, неудачная проверка явно оставляет погоду ясной до следующей проверки.
	clearOnFailedRoll = false
	#Шанс дождя весной за одну проверку, %.
	# Default: 55
	# Range: 0 ~ 100
	springRainChancePercent = 55
	#Шанс дождя летом за одну проверку, %.
	# Default: 35
	# Range: 0 ~ 100
	summerRainChancePercent = 35
	#Шанс дождя осенью за одну проверку, %.
	# Default: 60
	# Range: 0 ~ 100
	autumnRainChancePercent = 60
	#Шанс осадков зимой за одну проверку, %.
	# Default: 50
	# Range: 0 ~ 100
	winterPrecipitationChancePercent = 50
	#Длительность весенних осадков, в минутах.
	# Default: 5
	# Range: 1 ~ 60
	springRainMinutes = 5
	#Длительность летних осадков, в минутах.
	# Default: 4
	# Range: 1 ~ 60
	summerRainMinutes = 4
	#Длительность осенних осадков, в минутах.
	# Default: 7
	# Range: 1 ~ 60
	autumnRainMinutes = 7
	#Длительность зимних осадков, в минутах.
	# Default: 8
	# Range: 1 ~ 60
	winterRainMinutes = 8
	#Шанс, что начавшиеся осадки станут грозой, %.
	# Default: 12
	# Range: 0 ~ 100
	thunderChancePercent = 12
	#Когда наступает зима, уже идущий дождь сразу визуально становится снегом и новые зимние осадки тоже отображаются снегом. Погода не обрывается — меняется именно тип осадков.
	winterForceSnowfall = true

#Накопление и таяние снега. Глубина задаётся целыми блоками; внутри каждого блока снег нарастает по 1/8.
[snow]
	#Включить сезонное накопление снега.
	enabled = true
	#Абсолютный предел глубины сугроба, в полных блоках. 5 = до 40 ванильных слоёв снега.
	# Default: 5
	# Range: 0 ~ 5
	maxDepthBlocks = 5
	#Максимальная глубина снега весной, в блоках.
	# Default: 1
	# Range: 0 ~ 5
	springMaxDepthBlocks = 1
	#Максимальная глубина снега летом, в блоках.
	# Default: 0
	# Range: 0 ~ 5
	summerMaxDepthBlocks = 0
	#Максимальная глубина снега осенью, в блоках.
	# Default: 1
	# Range: 0 ~ 5
	autumnMaxDepthBlocks = 1
	#Максимальная глубина снега зимой, в блоках.
	# Default: 5
	# Range: 0 ~ 5
	winterMaxDepthBlocks = 5
	#При какой температуре и ниже обычные осадки могут накапливать снег, °C.
	# Default: 0
	# Range: -80 ~ 80
	temperatureThresholdC = 0
	#Когда игрок приходит в ранее выгруженный чанк зимой, сразу догнать его до текущего сезона, чтобы за границей старой области не начиналась бесснежная земля.
	catchUpOnChunkLoad = true
	#Максимальная глубина догоняющего снега в обычных слоях по 1/8 блока. Профиль симуляции может дополнительно ограничить её. Догон теперь размазан по тикам, а не выполняется целым чанком сразу.
	# Default: 40
	# Range: 1 ~ 40
	catchUpMaxLayers = 40
	#Какая доля подходящей открытой поверхности может покрыться догоняющим снегом, %. Низкие профили симуляции автоматически уменьшают фактическое покрытие.
	# Default: 95
	# Range: 0 ~ 100
	catchUpCoveragePercent = 95
	#Сколько слоёв по 1/8 блока добавлять за успешную глобальную попытку. 1 = плавно, 2-4 = быстрые метели.
	# Default: 1
	# Range: 1 ~ 4
	layersPerSuccessfulPass = 1
	#Шанс добавить 1/8 блока снега весной за проверку, %.
	# Default: 20
	# Range: 0 ~ 100
	springAccumulationChancePercent = 20
	#Шанс добавить 1/8 блока снега летом за проверку, %.
	# Default: 0
	# Range: 0 ~ 100
	summerAccumulationChancePercent = 0
	#Шанс добавить 1/8 блока снега осенью за проверку, %.
	# Default: 15
	# Range: 0 ~ 100
	autumnAccumulationChancePercent = 15
	#Шанс добавить 1/8 блока снега зимой за проверку, %.
	# Default: 75
	# Range: 0 ~ 100
	winterAccumulationChancePercent = 75
	#Разрешить снегу постепенно таять, когда температура выше порога.
	meltEnabled = true
	#Шанс убрать 1/8 блока снега за тёплую глобальную проверку, %.
	# Default: 35
	# Range: 0 ~ 100
	meltChancePercent = 35

#Зимние изменения открытой поверхности: замерзание воды, гибель посевов и деградация грядок. Они имитируются случайными проверками загруженных чанков как ванильные random ticks и строго подчиняются выбранному профилю симуляции. Под крышей/в теплице посевы и грядки защищены.
[winterSurface]
	#Главный переключатель зимнего воздействия на воду и сельское хозяйство.
	enabled = true
	#Замораживать верхний открытый слой воды зимой. Замораживается только вода, которую видно небу.
	freezeWater = true
	#Если включено, зимой открытая вода может замерзать независимо от исходной температуры биома. Если выключено, используется порог ниже.
	forceWaterFreezeInWinter = true
	#Порог сезонной температуры для замерзания воды, °C, когда принудительное зимнее замерзание выключено.
	# Default: 0
	# Range: -80 ~ 80
	waterFreezeThresholdC = 0
	#Весной/летом/осенью превращать только лёд, созданный Seasons,Kokk, обратно в воду. Игроком поставленный лёд мод не трогает.
	thawSeasonalIce = true
	#Открытые посевы из ванильного тега #minecraft:crops постепенно погибают зимой. Посевы под крышей/в теплице защищены.
	killExposedCrops = true
	#Шанс уничтожить открытый посев при зимней проверке его колонки, %.
	# Default: 35
	# Range: 0 ~ 100
	cropDeathChancePercent = 35
	#Открытые грядки зимой постепенно превращаются обратно в обычную землю.
	revertExposedFarmland = true
	#Шанс превратить открытую грядку в землю при зимней проверке её колонки, %.
	# Default: 45
	# Range: 0 ~ 100
	farmlandRevertChancePercent = 45

#Сезонная температура и интеграция с Cold Sweat. Переход температуры между сезонами плавный.
[temperature]
	#Включить сезонную поправку температуры.
	enabled = true
	#Добавлять сезонную поправку как отдельный WORLD-модификатор Cold Sweat, не перезаписывая его собственную систему.
	coldSweatIntegration = true
	#Поправка температуры весной, °C.
	# Default: 2
	# Range: -80 ~ 80
	springOffsetC = 2
	#Поправка температуры летом, °C.
	# Default: 8
	# Range: -80 ~ 80
	summerOffsetC = 8
	#Поправка температуры осенью, °C.
	# Default: -2
	# Range: -80 ~ 80
	autumnOffsetC = -2
	#Поправка температуры зимой, °C.
	# Default: -12
	# Range: -80 ~ 80
	winterOffsetC = -12

#Редкое естественное появление новых деревьев весной.
[springGrowth]
	#Разрешает редкие попытки вырастить новое дерево рядом с игроками весной.
	enabled = true
	#Как часто запускать цикл попыток появления новых деревьев, в минутах.
	# Default: 10
	# Range: 1 ~ 240
	intervalMinutes = 10
	#Сколько случайных точек проверять на каждого игрока за цикл. 0 = не пытаться.
	# Default: 2
	# Range: 0 ~ 64
	attemptsPerPlayer = 2
	#Радиус поиска места для нового дерева вокруг игрока, в блоках.
	# Default: 64
	# Range: 12 ~ 256
	radiusBlocks = 64
	#Минимальное расстояние от игрока до нового дерева, в блоках.
	# Default: 18
	# Range: 0 ~ 128
	minDistanceFromPlayerBlocks = 18
