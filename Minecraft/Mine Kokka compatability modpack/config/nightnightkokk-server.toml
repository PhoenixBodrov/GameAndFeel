#Настройки длины дня и ночи в обычном мире.
[time]
	#Режим неба: NORMAL — обычная смена суток, ETERNAL_DAY — вечный день, ETERNAL_NIGHT — вечная ночь.
	#Вечный день фиксирует небесные часы на 6000, вечная ночь — на 18000.
	#Фиксируется только день/ночь: игровые тики, мобы, печи и механизмы продолжают работать.
	#Ускорение сна работает и при зафиксированном небе. Правило doDaylightCycle не изменяется.
	#Allowed Values: NORMAL, ETERNAL_DAY, ETERNAL_NIGHT
	timeMode = "NORMAL"
	#Использовать отдельную настраиваемую длину дня и ночи в обычном мире.
	enableCustomTime = true
	#Реальная длительность дневной половины суток (0..11999) в минутах.
	#В ванильном Minecraft день длится 10 минут.
	# Default: 10.0
	# Range: 0.25 ~ 1440.0
	dayLengthMinutes = 60.0
	#Реальная длительность ночной половины суток (12000..23999) в минутах без ускорения сна.
	#В ванильном Minecraft ночь длится 10 минут.
	# Default: 10.0
	# Range: 0.25 ~ 1440.0
	nightLengthMinutes = 20.0

#Настройки ускоренного сна.
[sleep]
	#Заменить мгновенный ванильный пропуск ночи на симулируемый ускоренный сон.
	enableAcceleration = true
	#Разрешать сон в любое время суток, если достигнут порог усталости.
	#Дневной сон и сон при фиксированном небе заканчиваются при усталости 0%, а не на рассвете.
	#Кровать, её доступность и проверка опасности сохраняются.
	#В режиме NORMAL эта настройка используется вместе с enableAcceleration.
	allowDaytimeSleep = true
	#За сколько реальных секунд должна пройти ПОЛНАЯ ночь (12000 тиков), если спят 100% игроков.
	#Если лечь посреди ночи, таймер пропорционален реально оставшейся части ночи.
	#При 50% спящих время удваивается, при 25% — увеличивается в 4 раза.
	#Сон никогда не делает ночь медленнее её обычной скорости.
	#Для дневного сна/вечной фазы это эквивалент 12000 тиков симуляции; фактический сон зависит от усталости.
	# Default: 120.0
	# Range: 5.0 ~ 3600.0
	allSleepingSeconds = 120.0
	#Максимальный множитель симуляции мира во время сна.
	#Небесное время может идти быстрее, чтобы сохранить нужную длительность сна.
	#Большие значения точнее симулируют печи, мобов, растения, редстоун, Create и т.п., но тяжелее для процессора.
	# Default: 32.0
	# Range: 1.0 ~ 128.0
	maxWorldSimulationMultiplier = 32.0
	#Примерный бюджет процессорного времени на дополнительные тики мира за один обычный серверный тик.
	#Контроллер адаптируется к реальной цене дополнительного тика, чтобы тяжёлые сборки меньше зависали.
	# Default: 30.0
	# Range: 1.0 ~ 200.0
	extraTickBudgetMs = 30.0
	#Разрешать подтверждение сна только если игрок действительно лежит в кровати.
	requireBed = true

#Настройки усталости игрока. Значения по умолчанию близки к Somnia CE.
[fatigue]
	#Включить систему усталости. В творческом режиме и наблюдателе усталость не накапливается.
	enableFatigue = true
	#Максимальное значение усталости. KokkHUD автоматически получает это значение от сервера.
	# Default: 100.0
	# Range: 1.0 ~ 10000.0
	maxFatigue = 100.0
	#Сколько реальных минут непрерывного бодрствования требуется, чтобы усталость выросла от 0 до максимума.
	#40 минут примерно соответствуют стандартной скорости Somnia CE 3.5.0.
	# Default: 40.0
	# Range: 1.0 ~ 1440.0
	awakeMinutesToMax = 40.0
	#Сколько СИМУЛИРУЕМЫХ минут сна требуется для восстановления от максимальной усталости до 0.
	#Во время ускоренного сна восстановление ускоряется вместе с ночью, поэтому полная ночь по умолчанию восстанавливает примерно 100%.
	# Default: 10.0
	# Range: 0.25 ~ 240.0
	sleepMinutesToRecover = 10.0
	#Минимальная усталость в процентах, необходимая для начала сна.
	#0 отключает ограничение. По умолчанию требуется 50% — и днём, и ночью.
	#Порог проверяется только при начале сна, а не во время восстановления.
	#Существующее значение в конфиге мира сохраняется при обновлении.
	# Default: 50.0
	# Range: 0.0 ~ 100.0
	minimumFatigueToSleepPercent = 50.0
	#Включить негативные эффекты при очень высокой усталости, как в Somnia.
	sideEffects = true
	#С какого процента усталости начинается первая стадия (тошнота).
	# Default: 70.0
	# Range: 0.0 ~ 100.0
	nauseaPercent = 70.0
	#С какого процента усталости начинается сильное замедление.
	# Default: 80.0
	# Range: 0.0 ~ 100.0
	slownessPercent = 80.0
	#С какого процента усталости начинается тяжёлая стадия (яд), как в Somnia.
	# Default: 90.0
	# Range: 0.0 ~ 100.0
	poisonPercent = 90.0
	#С какого процента начинается крайняя стадия сильной тошноты.
	# Default: 95.0
	# Range: 0.0 ~ 100.0
	exhaustedPercent = 95.0
