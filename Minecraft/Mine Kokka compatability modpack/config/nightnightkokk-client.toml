#Настройки кинематографической камеры сна.
[camera]
	#Включать кинематографическую камеру сразу после подтверждения сна.
	cinematicByDefault = true
	#Средняя длительность одного кадра в секундах. Каждый кадр немного случайно длиннее или короче.
	# Default: 7.0
	# Range: 2.0 ~ 30.0
	shotDurationSeconds = 7.0
	#Базовая дистанция близких кадров вокруг кровати и интересных объектов.
	# Default: 4.5
	# Range: 1.5 ~ 12.0
	nearRadius = 4.5
	#Базовая дистанция широких пейзажных и внешних кадров.
	# Default: 15.0
	# Range: 5.0 ~ 40.0
	farRadius = 15.0
	#Радиус поиска природы, воды, лавы, мобов, огородов и интересных наружных объектов вокруг кровати.
	#Сканирование выполняется один раз на каждый сон.
	# Default: 36
	# Range: 12 ~ 64
	environmentScanRadius = 36
	#За сколько секунд до рассвета прекратить смену кадров и перейти к финальному кадру восхода.
	#0 отключает специальный финальный кадр.
	# Default: 30.0
	# Range: 0.0 ~ 120.0
	sunriseFinaleSeconds = 30.0
	#Подстраивать высоту, дистанцию и движение пейзажных кадров под биом и окружающий рельеф.
	biomeAware = true
	#После первого кадра стараться снимать только снаружи. В тесных помещениях камера делает монтажную склейку наружу вместо прохода через стены.
	avoidInteriors = true

#Ручная слежка во время сна. Эти настройки действуют только у этого клиента.
[tracking]
	#После выбора цели включать автоматические ракурсы вместо ручной камеры с мышью.
	#Во время закреплённой слежки режимы переключаются отдельной клавишей (по умолчанию M).
	autoAnglesByDefault = false
	#Скорость свободной камеры, блоков в секунду. Ускорение полёта увеличивает её втрое.
	# Default: 10.0
	# Range: 1.0 ~ 64.0
	freeCameraSpeed = 10.0
	#Базовая дистанция ракурсов вокруг выбранного моба или места.
	# Default: 6.0
	# Range: 2.0 ~ 32.0
	followDistance = 6.0
	#Максимальная дальность выбора моба или точки по прицелу. Только загруженная область.
	# Default: 48.0
	# Range: 4.0 ~ 128.0
	selectionRange = 48.0
	#Подсвечивать ближайших к камере мобов через стены только на этом клиенте.
	#Наведённая и закреплённая цель выделяются даже при отключении общей подсветки.
	highlightNearbyMobs = true
	#Радиус подсветки вокруг камеры, а не вокруг спящего тела, в блоках.
	# Default: 32.0
	# Range: 4.0 ~ 128.0
	highlightRadius = 32.0
	#Лимит ближайших подсвеченных мобов. Наведённая/закреплённая цель добавляется отдельно.
	# Default: 64
	# Range: 1 ~ 256
	maxHighlightedMobs = 64

#Визуальные настройки сна.
[visual]
	#Ускорять обычные облака во время ускоренного сна, в том числе при вечном дне/ночи.
	#Не изменяет солнце, луну, камеру или скорость клиента.
	#Собственные облака шейдеров и заменяющих рендер модов могут не использовать этот эффект.
	accelerateCloudsDuringSleep = true
	#Прозрачность лёгкого затемнения экрана во время сна: 0..180.
	# Default: 42
	# Range: 0 ~ 180
	overlayDarkness = 42
	#Показывать подсказку сна, число спящих, ускорение и время до рассвета.
	showSleepStatus = true
	#Автоматически скрывать чат после подтверждения сна. Клавиша показа/скрытия чата работает во время сна.
	autoHideChat = true
	#Скрывать внешние информационные оверлеи вроде Jade во время кинематографического сна.
	hideExternalOverlays = true
