	#Base hand-breach power at evolution level 1. Material tiers are unlocked by level; breach power controls how quickly an unlocked block is broken.
	# Default: 30.0
	# Range: 1.0 ~ 100000.0
	mobBreachPowerBase = 30.0
	#Additional hand-breach power for each evolution level above 1.
	# Default: 45.0
