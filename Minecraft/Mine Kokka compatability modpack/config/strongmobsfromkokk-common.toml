	overrides = ["strongmobsfromkokk:reinforced_glass=220", "strongmobsfromkokk:fortress_glass=360", "strongmobsfromkokk:bastion_glass=520", "strongmobsfromkokk:reinforced_bars=420", "strongmobsfromkokk:fortress_bars=620", "strongmobsfromkokk:bastion_bars=820", "strongmobsfromkokk:reinforced_iron_door=500", "strongmobsfromkokk:fortress_door=700", "strongmobsfromkokk:bastion_door=900"]

#High-level reinforcement ability
[reinforcements]
	#Allow sufficiently evolved mobs to call zombie reinforcements while fighting.
	enabled = true
	#Minimum evolution level required to call reinforcements.
	# Default: 8
	# Range: 1 ~ 10
	startLevel = 8
	#Cooldown between reinforcement calls for one mob. 20 ticks = 1 second.
	# Default: 1800
	# Range: 100 ~ 72000
	cooldownTicks = 1800
	#A mob may call reinforcements when its health percentage is at or below this value.
	# Default: 55.0
	# Range: 1.0 ~ 100.0
	healthTriggerPercent = 55.0
	#A high-level mob may also call reinforcements after being seriously stuck for this many ticks.
	# Default: 100
	# Range: 20 ~ 2400
	stuckTriggerTicks = 100
	#Base chance for a valid reinforcement call. Levels 9-10 gain an additional chance bonus.
	# Default: 45.0
	# Range: 0.0 ~ 100.0
	chancePercent = 45.0
	#Number of helpers emerging at levels 8-9 by default.
	# Default: 2
	# Range: 1 ~ 8
	baseCount = 2
	#Extra helpers added when the caller is level 10.
	# Default: 1
	# Range: 0 ~ 8
	level10ExtraCount = 1
	#Duration of the rise-from-ground visual sequence for summoned helpers.
	# Default: 24
	# Range: 5 ~ 100
	emergeTicks = 24
	#Approximate horizontal distance from the caller used when searching for helper emergence positions. Helpers never intentionally spawn through a sealed wall around the victim.
	# Default: 5.0
	# Range: 2.0 ~ 12.0
	spawnRadius = 5.0

