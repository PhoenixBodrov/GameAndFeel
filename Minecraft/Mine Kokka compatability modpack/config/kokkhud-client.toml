foodXOffset = 0
# Default: 0
# Range: -200 ~ 200
foodYOffset = 0
# Default: 0
# Range: -200 ~ 200
xpXOffset = 0
# Default: 0
# Range: -200 ~ 200
xpYOffset = 0
