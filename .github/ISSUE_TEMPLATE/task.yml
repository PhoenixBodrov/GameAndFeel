name: Development task
description: Track a concrete piece of work
title: "Task: "
body:
  - type: dropdown
    id: pack
    attributes:
      label: Affected pack
      options:
        - Minecraft AI
        - SteamPunk
        - Steampunk 1.1
        - Mine Kokka
        - Mine Kokka compatability modpack
        - CS:GO
        - Shared tooling or documentation
        - Unsure
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: What needs to be done?
      description: Describe the change and relevant files.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Completion checks
      description: List the checks needed before closing this task.
  - type: textarea
    id: context
    attributes:
      label: Related ideas or issues
      description: Link any related feature, bug or design note.
