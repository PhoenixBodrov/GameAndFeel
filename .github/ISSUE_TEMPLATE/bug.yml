name: Bug report
description: Report a problem in the Game and Feel packs
title: "Bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: pack
    attributes:
      label: Affected pack
      options:
        - Minecraft AI
        - SteamPunk
        - Steampunk 1.1
        - Mine Kokka
        - Mine Kokka compatability modpack
        - CS:GO
        - Shared tooling or documentation
        - Unsure
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Search existing bugs before opening a new issue. If one matches, add your reproduction steps, affected version and evidence as a comment on that issue. Do not post passwords, player data or private addresses.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include where and when it happens.
  - type: textarea
    id: expected
    attributes:
      label: What should happen instead?
  - type: textarea
    id: versions
    attributes:
      label: Relevant versions
      description: Include the pack version, game version, loader where applicable, and relevant mods when known.
  - type: dropdown
    id: environment
    attributes:
      label: Where did it happen?
      options:
        - Single player
        - Multiplayer client
        - Dedicated server
        - Other
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or safe log excerpts
      description: Remove personal information and secrets before attaching anything.
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Optional but recommended. Drag a log or crash report file into this field, or paste a short relevant excerpt. Remove passwords, tokens and private details first.
    validations:
      required: false
